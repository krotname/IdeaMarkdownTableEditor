name: Publish to JetBrains Marketplace

on:
  workflow_dispatch:
    inputs:
      version:
        description: Plugin version without leading v; must match VERSION.
        required: true
        type: string
      mode:
        description: Dry-run builds and verifies the ZIP; publish uploads it to Marketplace.
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
      confirmation:
        description: For publish, type markdown-table-editor-idea:<version>.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: markdown-table-editor-idea-marketplace
  cancel-in-progress: false

jobs:
  publish:
    name: Marketplace / ${{ inputs.mode }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
      JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Validate release request and secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid version: '$env:RELEASE_VERSION'."
          }

          $canonicalVersion = (Get-Content -Raw VERSION).Trim()
          if ($env:RELEASE_VERSION -ne $canonicalVersion) {
            throw "Requested version '$env:RELEASE_VERSION' does not match VERSION '$canonicalVersion'."
          }

          if ($env:RELEASE_MODE -eq 'publish') {
            if ($env:GITHUB_REF -ne 'refs/heads/main') {
              throw "Publishing is allowed only from refs/heads/main; got '$env:GITHUB_REF'."
            }
            if ([string]::IsNullOrWhiteSpace($env:JETBRAINS_MARKETPLACE_TOKEN)) {
              throw "Required GitHub Actions secret 'JETBRAINS_MARKETPLACE_TOKEN' is missing."
            }
            $expectedConfirmation = "markdown-table-editor-idea:$env:RELEASE_VERSION"
            if ($env:RELEASE_CONFIRMATION -ne $expectedConfirmation) {
              throw "Publish confirmation must exactly match '$expectedConfirmation'."
            }
          }

          Write-Host "Validated $env:RELEASE_MODE request for markdown-table-editor-idea:$env:RELEASE_VERSION."

      - name: Build and verify the plugin
        shell: cmd
        run: gradlew.bat clean check buildPlugin --no-daemon --console=plain --no-build-cache --rerun-tasks

      - name: Verify plugin against baseline IDEA
        shell: cmd
        run: gradlew.bat verifyPlugin -PverifyRecommendedIdes=false -PverifyAllJetBrainsIdes=false --no-daemon --console=plain --no-build-cache

      - name: Upload verified artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketplace-${{ inputs.version }}-${{ inputs.mode }}
          path: |
            build/distributions/MarkdownTableEditorIdea-${{ inputs.version }}.zip
            build/release/MARKETPLACE_SUBMISSION.md
          if-no-files-found: error
          retention-days: 14

      - name: Publish to JetBrains Marketplace
        if: ${{ inputs.mode == 'publish' }}
        shell: cmd
        run: gradlew.bat publishPlugin --no-daemon --console=plain --no-build-cache
