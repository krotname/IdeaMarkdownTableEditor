name: Publish to JetBrains Marketplace

on:
  workflow_dispatch:
    inputs:
      version:
        description: Plugin version without leading v; must match VERSION.
        required: true
        type: string
      mode:
        description: Dry-run builds and verifies the ZIP; publish uploads it to Marketplace.
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
      confirmation:
        description: For publish, type markdown-table-editor-idea:<version>.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: markdown-table-editor-idea-marketplace
  cancel-in-progress: false

jobs:
  # Runs for both modes and never sees the Marketplace token: workflow_dispatch takes the workflow
  # file and the build scripts from the dispatched ref, so anything reachable here must be treated
  # as untrusted.
  verify:
    name: Verify ${{ inputs.version }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Validate release request
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid version: '$env:RELEASE_VERSION'."
          }

          $canonicalVersion = (Get-Content -Raw VERSION).Trim()
          if ($env:RELEASE_VERSION -ne $canonicalVersion) {
            throw "Requested version '$env:RELEASE_VERSION' does not match VERSION '$canonicalVersion'."
          }

          if ($env:RELEASE_MODE -eq 'publish') {
            if ($env:GITHUB_REF -ne 'refs/heads/main') {
              throw "Publishing is allowed only from refs/heads/main; got '$env:GITHUB_REF'."
            }
            $expectedConfirmation = "markdown-table-editor-idea:$env:RELEASE_VERSION"
            if ($env:RELEASE_CONFIRMATION -ne $expectedConfirmation) {
              throw "Publish confirmation must exactly match '$expectedConfirmation'."
            }
          }

          Write-Host "Validated $env:RELEASE_MODE request for markdown-table-editor-idea:$env:RELEASE_VERSION."

      - name: Build and verify the plugin
        shell: cmd
        run: gradlew.bat clean check buildPlugin --no-daemon --console=plain --no-build-cache --rerun-tasks

      - name: Verify plugin against baseline IDEA
        shell: cmd
        run: gradlew.bat verifyPlugin -PverifyRecommendedIdes=false -PverifyAllJetBrainsIdes=false --no-daemon --console=plain --no-build-cache

      - name: Upload verified artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketplace-${{ inputs.version }}-${{ inputs.mode }}
          path: |
            build/distributions/MarkdownTableEditorIdea-${{ inputs.version }}.zip
            build/release/MARKETPLACE_SUBMISSION.md
          if-no-files-found: error
          retention-days: 7

  # The token lives in the "marketplace" environment, which requires a reviewer approval and is
  # limited to protected branches. Dropping the environment from this job would also drop access to
  # the secret, so the gate cannot be removed by pushing a modified workflow to a side branch.
  publish:
    name: Publish ${{ inputs.version }}
    needs: verify
    if: ${{ inputs.mode == 'publish' }}
    runs-on: windows-latest
    timeout-minutes: 60
    environment: marketplace
    env:
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Confirm the publish ref and secret
        shell: pwsh
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "Publishing is allowed only from refs/heads/main; got '$env:GITHUB_REF'."
          }
          if ([string]::IsNullOrWhiteSpace($env:JETBRAINS_MARKETPLACE_TOKEN)) {
            throw "Required environment secret 'JETBRAINS_MARKETPLACE_TOKEN' is missing."
          }
          Write-Host "Publishing markdown-table-editor-idea:$env:RELEASE_VERSION from main."

      - name: Publish to JetBrains Marketplace
        shell: cmd
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: gradlew.bat publishPlugin --no-daemon --console=plain --no-build-cache
