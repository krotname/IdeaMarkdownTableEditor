name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version guard without leading v; must match VERSION.
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  version:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        shell: bash
        run: |
          canonical_version="$(tr -d '[:space:]' < VERSION)"
          requested_version="${{ github.event.inputs.version }}"
          if [ -z "$requested_version" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            requested_version="${GITHUB_REF_NAME#v}"
          fi
          if [ -n "$requested_version" ] && [ "$requested_version" != "$canonical_version" ]; then
            echo "Release version '$requested_version' does not match VERSION '$canonical_version'. Update VERSION first." >&2
            exit 1
          fi
          echo "version=$canonical_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$canonical_version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    # Release artifacts are compiled on the self-hosted runner in Russia, which is what the
    # Russian software registry filing declares as the compilation host. Pull request and CI
    # checks stay on GitHub-hosted runners.
    #
    # The runner is adler-lenovo rather than the always-on server: Gradle resolves the IntelliJ
    # Platform from a CloudFront-backed JetBrains repository, and on the server's direct link that
    # download stalls part-way every time. The Notepad++ plugin has no such dependency and keeps
    # building on the server.
    #
    # A manual dispatch runs the workflow file and the build scripts of whatever ref was picked,
    # so the runner is bound to trusted refs only: the default branch and release tags. Any other
    # ref skips this job, and the release job that depends on it is skipped with it.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, windows, adler-lenovo]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Build, verify, and package
        shell: cmd
        run: .\gradlew.bat clean check corePerformance verifyPlugin buildPlugin "-PpluginVersion=${{ needs.version.outputs.version }}" -PverifyRecommendedIdes=false -PverifyAllJetBrainsIdes=false --no-daemon --console=plain --no-build-cache --rerun-tasks

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: idea-plugin
          path: |
            build/distributions/MarkdownTableEditorIdea-${{ needs.version.outputs.version }}.zip
            build/release/MARKETPLACE_SUBMISSION.md
          if-no-files-found: error

  release:
    needs:
      - version
      - build
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets

      - name: Generate release checksums
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mapfile -t files < <(find release-assets -type f -name '*.zip' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release ZIP files were downloaded." >&2
            exit 1
          fi

          timestamp="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          sbom_file="release-assets/MarkdownTableEditorIdea-$VERSION-sbom.cdx.json"
          cat > "$sbom_file" <<EOF
          {
            "bomFormat": "CycloneDX",
            "specVersion": "1.6",
            "version": 1,
            "metadata": {
              "timestamp": "$timestamp",
              "component": {
                "type": "application",
                "name": "IdeaMarkdownTableEditor",
                "version": "$VERSION",
                "purl": "pkg:github/krotname/IdeaMarkdownTableEditor@v$VERSION"
              }
            }
          }
          EOF

          marketplace_doc="$(find release-assets -type f -name 'MARKETPLACE_SUBMISSION.md' | sort | head -n 1)"
          checksum_files=("${files[@]}" "$sbom_file")
          if [ -n "$marketplace_doc" ]; then
            checksum_files+=("$marketplace_doc")
          fi

          sha256sum "${checksum_files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release provenance attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: |
            release-assets/**/*.zip
            release-assets/**/*-sbom.cdx.json
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mapfile -t files < <(find release-assets -type f \( -name '*.zip' -o -name '*-sbom.cdx.json' \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release ZIP files were downloaded." >&2
            exit 1
          fi

          marketplace_doc="$(find release-assets -type f -name 'MARKETPLACE_SUBMISSION.md' | sort | head -n 1)"
          cat > release-notes.md <<EOF
          ## Builds / Downloads

          - [MarkdownTableEditorIdea-$VERSION.zip](https://github.com/krotname/IdeaMarkdownTableEditor/releases/download/v$VERSION/MarkdownTableEditorIdea-$VERSION.zip)
          - [MarkdownTableEditorIdea-$VERSION-sbom.cdx.json](https://github.com/krotname/IdeaMarkdownTableEditor/releases/download/v$VERSION/MarkdownTableEditorIdea-$VERSION-sbom.cdx.json)
          - [SHA256SUMS.txt](https://github.com/krotname/IdeaMarkdownTableEditor/releases/download/v$VERSION/SHA256SUMS.txt)
          - [MARKETPLACE_SUBMISSION.md](https://github.com/krotname/IdeaMarkdownTableEditor/releases/download/v$VERSION/MARKETPLACE_SUBMISSION.md)

          ## What's Changed

          - The plugin, its table engine, and the Notepad++ edition of Markdown Table Editor now ship under one license, GPL-3.0-or-later. Earlier releases stay available under their original MIT terms.
          - Upgraded the bundled table engine to name.krot:markdown-table-core:0.3.0, which carries the same behavior as 0.2.0 under the new license.
          - Rebuilt the plugin ZIP with SHA-256 sums, SBOM, and GitHub attestations.

          ## Validation

          - GitHub Actions release build completed with tests, coverage checks, baseline Plugin Verifier, and core performance benchmarks.
          EOF

          assets=("${files[@]}" SHA256SUMS.txt)
          if [ -n "$marketplace_doc" ]; then
            assets+=("$marketplace_doc")
          fi

          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --title "Markdown Table Editor $VERSION" --notes-file release-notes.md --latest
          else
            gh release create "$TAG_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Markdown Table Editor $VERSION" --notes-file release-notes.md --latest
          fi
