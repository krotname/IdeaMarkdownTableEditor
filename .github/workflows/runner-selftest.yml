name: Runner self-test

# Manual check that the self-hosted release runner can still build the plugin end to end.
# It never publishes anything: no release, no Marketplace upload, no attestation.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    # The owner can verify a reviewed branch before merge; no publishing secrets are used.
    if: >-
      github.repository == 'krotname/IdeaMarkdownTableEditor' &&
      github.actor == github.repository_owner && github.triggering_actor == github.repository_owner &&
      github.ref_type == 'branch'
    runs-on: ${{ fromJSON(vars.CI_WINDOWS_RUNS_ON || '["self-hosted","Windows","X64","adler-white-idea","adler-black-ephemeral"]') }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Report runner environment
        shell: pwsh
        run: |
          "runner: $env:RUNNER_NAME"
          "host: $env:COMPUTERNAME"
          "os: " + (Get-CimInstance Win32_OperatingSystem).Caption
          "cpu: " + (Get-CimInstance Win32_Processor | Select-Object -First 1 -ExpandProperty Name)
          "ram_gb: " + [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB)
          "free_disk_gb: " + [math]::Round((Get-PSDrive C).Free / 1GB)
          java -version

      - name: Build and test
        shell: cmd
        # Same cache flags as the release build: gradle.properties turns the build cache on, and a
        # cache hit would let the job pass without the runner actually compiling and testing.
        run: .\gradlew.bat clean check corePerformance verifyPlugin buildPlugin -PverifyRecommendedIdes=false -PverifyAllJetBrainsIdes=false --no-daemon --console=plain --no-build-cache --rerun-tasks

      - name: Report produced artifacts
        shell: pwsh
        run: Get-ChildItem build/distributions -File | ForEach-Object { "{0} {1} bytes" -f $_.Name, $_.Length }
