name: CodeQL

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    - cron: "31 2 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (java)
    # Keep Java CodeQL on Linux; do not point it at an unprovisioned or shared ARC pool.
    if: >-
      !(github.repository == 'krotname/IdeaMarkdownTableEditor' &&
        github.actor == github.repository_owner && github.triggering_actor == github.repository_owner &&
        (github.event_name != 'pull_request' ||
          (github.event.pull_request.user.login == github.repository_owner &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           !github.event.pull_request.head.repo.fork))) || vars.CI_LINUX_RUNS_ON != ''
    runs-on: >-
      ${{ fromJSON(github.repository == 'krotname/IdeaMarkdownTableEditor' &&
          github.actor == github.repository_owner && github.triggering_actor == github.repository_owner &&
          (github.event_name != 'pull_request' ||
            (github.event.pull_request.user.login == github.repository_owner &&
             github.event.pull_request.head.repo.full_name == github.repository &&
             !github.event.pull_request.head.repo.fork)) &&
          vars.CI_LINUX_RUNS_ON || '["ubuntu-latest"]') }}
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java-kotlin
      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
