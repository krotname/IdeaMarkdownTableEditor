name: CI

on:
  push:
    branches:
      - main
    # Documentation and images cannot break a script, manifest or config:
    # a change made only of these files skips validation entirely.
    paths-ignore:
      - '**.md'
      - '**.mdx'
      - '**.rst'
      - '**.adoc'
      - '**.pdf'
      - '**.doc'
      - '**.docx'
      - '**.odt'
      - '**.rtf'
      - '**.ppt'
      - '**.pptx'
      - '**.odp'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.gif'
      - '**.webp'
      - '**.avif'
      - '**.bmp'
      - '**.tif'
      - '**.tiff'
      - '**.ico'
      - '**.svg'
  pull_request:
    # Documentation and images cannot break a script, manifest or config:
    # a change made only of these files skips validation entirely.
    paths-ignore:
      - '**.md'
      - '**.mdx'
      - '**.rst'
      - '**.adoc'
      - '**.pdf'
      - '**.doc'
      - '**.docx'
      - '**.odt'
      - '**.rtf'
      - '**.ppt'
      - '**.pptx'
      - '**.odp'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.gif'
      - '**.webp'
      - '**.avif'
      - '**.bmp'
      - '**.tif'
      - '**.tiff'
      - '**.ico'
      - '**.svg'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  idea:
    name: Tests / IDEA plugin
    # Forks, bots, other authors and non-owner reruns cannot select the home runner.
    if: >-
      github.repository == 'krotname/IdeaMarkdownTableEditor' &&
      github.actor == github.repository_owner && github.triggering_actor == github.repository_owner &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.head.repo.fork))
    runs-on: ${{ fromJSON(vars.CI_WINDOWS_RUNS_ON || '["self-hosted","Windows","X64","adler-white-idea","adler-black-ephemeral"]') }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Clean check and build plugin
        shell: cmd
        run: gradlew.bat clean check buildPlugin --no-daemon --console=plain --no-build-cache --rerun-tasks

      - name: Core performance benchmarks
        shell: cmd
        run: gradlew.bat corePerformance --no-daemon --console=plain --no-build-cache --rerun-tasks

      - name: Make installed Git shell available to Codecov
        shell: pwsh
        run: |
          $gitBin = Join-Path $env:ProgramFiles 'Git\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $gitBin 'sh.exe'))) { throw 'Installed Git shell missing' }
          $gitBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: core/build/reports/coverage/jacoco.xml
          flags: idea-core
          name: idea-markdown-table-editor
          fail_ci_if_error: false

      - name: Upload plugin package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: idea-plugin-ci
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Verify plugin against baseline IDEA
        shell: cmd
        run: gradlew.bat verifyPlugin -PverifyRecommendedIdes=false -PverifyAllJetBrainsIdes=false --no-daemon --console=plain --no-build-cache

      - name: Upload Gradle reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: idea-gradle-reports
          path: build/reports/**
          if-no-files-found: ignore
          retention-days: 7
